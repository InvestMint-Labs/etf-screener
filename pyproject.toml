[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-screener"
version = "0.1.0"
description = "Screen and compare every ETF listed on the TSX, with an open fund-facts dataset and your own price key."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
test = ["pytest>=7"]

[project.urls]
Source = "https://github.com/InvestMint-Labs/etf-screener"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
